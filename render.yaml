databases:
  # Database Service
  - name: blog-postgres-db
    databaseName: blog_db
    user: postgres
    plan: free

services:
  # Backend Web Service
  - type: web
    name: blog-backend-api
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: blog-postgres-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: blog-postgres-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: blog-postgres-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173

  # Frontend Static Site
  - type: web
    name: blog-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: blog-backend-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
