server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

spring:
  application:
    name: blog-platform
  profiles:
    active: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blog_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    # 256-bit secret key for JWT signatures (at least 32 characters long)
    secret: ${JWT_SECRET:SecretKeyForJWTTokenSigningDoNotUseInProductionMakeItLongerThan32Bytes}
    # Token lifespan - Access Token (15 mins = 900000 ms)
    accessTokenExpirationMs: 900000
    # Token lifespan - Refresh Token (7 days = 604800000 ms)
    refreshTokenExpirationMs: 604800000
  cookie:
    secure: ${COOKIE_SECURE:false}
    sameSite: ${COOKIE_SAME_SITE:Lax}
  email:
    verification-url: ${FRONTEND_URL:http://localhost:5173}/verify-email
    reset-password-url: ${FRONTEND_URL:http://localhost:5173}/reset-password

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

logging:
  level:
    root: INFO
    com.blogplatform: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
